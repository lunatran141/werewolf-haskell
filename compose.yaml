services:
  server:
    build:
      context: .
      target: runtime
    environment:
      APP_PORT: ${APP_PORT:-8080}
      ANALYTICS_HOST: analytics-worker
      ANALYTICS_PORT: ${ANALYTICS_PORT:-9090}
      ANALYTICS_SPOOL_DIR: /tmp/analytics-spool
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      - analytics-worker
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:${APP_PORT:-8080}/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  analytics-worker:
    build:
      context: .
      target: runtime
    command: ["analytics-worker"]
    environment:
      ANALYTICS_PORT: ${ANALYTICS_PORT:-9090}
      ANALYTICS_OUTPUT: /data/matches.jsonl
    volumes:
      - analytics-data:/data
    init: true
    read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $${ANALYTICS_PORT:-9090}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  analytics-data:
