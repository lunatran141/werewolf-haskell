name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.6"
          cabal-version: "3.10"
      - name: Update package index
        run: cabal update
      - name: Build all components
        run: cabal build all --enable-tests --ghc-options=-Werror
      - name: Run all tests with coverage
        run: cabal test all --enable-tests --enable-coverage --test-show-details=direct
      - name: Repeat full suite to catch flaky tests
        run: cabal test all --enable-tests --test-show-details=direct
      - name: Set up Node.js for browser UI tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check and test browser UI
        run: |
          node --check web/app.js
          node --test test/T06UiSpec.cjs test/T07UiSpec.cjs test/T13UiSecuritySpec.cjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          docker compose config
          docker compose -f compose.yaml -f docker-compose.nfs.yml --profile nfs-demo config
      - name: Build and start container
        run: docker compose up --build --detach
      - name: Wait for healthy server
        shell: bash
        run: |
          container_id="$(docker compose ps --quiet server)"
          test -n "$container_id"

          for attempt in {1..30}; do
            health="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
            if [[ "$health" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$health" == "unhealthy" ]]; then
              docker compose logs server
              exit 1
            fi
            sleep 2
          done

          docker compose logs server
          exit 1
      - name: Verify health endpoint
        shell: bash
        run: |
          response="$(curl --fail --silent http://127.0.0.1:8080/health)"
          test "$response" = '{"status":"ok"}'
      - name: Show container status
        if: always()
        run: docker compose ps
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
